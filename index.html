<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HOMECADI WEDDING - thiep cuoi cua Hoang Duy va Ngoc Thao."
    />
    <meta property="og:title" content="HOMECADI WEDDING" />
    <meta
      property="og:description"
      content="Chung minh cuoi roi! 14,15.10.2026"
    />
    <meta property="og:image" content="%BASE_URL%assets/cover.jpg" />
    <title>HOMECADI WEDDING</title>
  </head>
  <body>
    <main id="app">
      <section class="phone-stage" aria-label="HOMECADI WEDDING">
        <article class="invitation-card">
          <div class="hero-photo" aria-label="Hoang Duy va Ngoc Thao">
            <img src="%BASE_URL%assets/cover.jpg" alt="Hoang Duy va Ngoc Thao" />
          </div>

          <div class="hero-copy">
            <p class="eyebrow">HOMECADI WEDDING</p>
            <h1>CHÚNG MÌNH CƯỚI RỒI!</h1>
            <p class="note">“20 năm cùng nhau trở nên đúng người”</p>
            <p class="date">14,15.10.2026</p>
          </div>

          <div class="couple-grid" aria-label="Co dau va chu re">
            <div class="person">
              <p class="role">CAMERA MAN</p>
              <p class="name">HOÀNG DUY</p>
            </div>
            <span class="ampersand" aria-hidden="true">&amp;</span>
            <div class="person">
              <p class="role">TEACHER</p>
              <p class="name">NGỌC THẢO</p>
            </div>
          </div>
        </article>
      </section>

      <section class="desktop-warning" aria-label="Thong bao thiet bi">
        <div>
          <p class="warning-kicker">HOMECADI WEDDING</p>
          <h2>Vui lòng mở thiệp trên điện thoại</h2>
          <p>
            Thiệp cưới này được thiết kế riêng cho màn hình dọc trên di động.
          </p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
